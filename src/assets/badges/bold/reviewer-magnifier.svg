<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Bold reviewer clipboard with magnifier" fill="none">
  <defs>
    <linearGradient id="brc-board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="brc-clip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c3aed" />
      <stop offset="1" stop-color="#4c1d95" />
    </linearGradient>
    <radialGradient id="brc-lens" cx="0.35" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#dbeafe" stop-opacity="0.85" />
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0.35" />
    </radialGradient>
  </defs>
  <!-- Clipboard -->
  <rect x="20" y="14" width="48" height="64" rx="6" fill="url(#brc-board)" stroke="#312e81" stroke-width="2" />
  <rect x="34" y="8" width="20" height="12" rx="3" fill="url(#brc-clip)" stroke="#4c1d95" stroke-width="2" />
  <!-- Lines -->
  <path d="M28 28 H56" stroke="#312e81" stroke-width="1.5" />
  <path d="M28 38 H60" stroke="#312e81" stroke-width="1.5" />
  <path d="M28 48 H56" stroke="#312e81" stroke-width="1.5" />
  <path d="M28 58 H50" stroke="#312e81" stroke-width="1.5" />
  <!-- Approval stamp -->
  <circle cx="42" cy="44" r="5" fill="#10b981" />
  <path d="M39 44 L41 46 L45 42" stroke="#ffffff" stroke-width="2" fill="none" />
  <!-- Magnifier lens -->
  <circle cx="64" cy="60" r="18" fill="url(#brc-lens)" stroke="#7c3aed" stroke-width="4" />
  <circle cx="64" cy="60" r="13" fill="none" stroke="#312e81" stroke-width="1" stroke-opacity="0.4" />
  <!-- Magnifier handle -->
  <rect x="76" y="72" width="14" height="6" rx="3" transform="rotate(45 76 72)" fill="#7c3aed" />
  <!-- Sparkles on lens -->
  <path d="M58 56 L60 60 L64 62 L60 64 L58 68 L56 64 L52 62 L56 60 Z" fill="#fbbf24" stroke="#b45309" stroke-width="1" />
</svg>
