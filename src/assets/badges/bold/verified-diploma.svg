<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Bold verified diploma with seal" fill="none">
  <defs>
    <linearGradient id="bvd2-ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" />
      <stop offset="1" stop-color="#b45309" />
    </linearGradient>
    <radialGradient id="bvd2-seal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3c7" />
      <stop offset="0.7" stop-color="#dc2626" />
      <stop offset="1" stop-color="#7f1d1d" />
    </radialGradient>
  </defs>
  <!-- Background burst -->
  <circle cx="40" cy="38" r="32" fill="#fef3c7" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 3" />
  <!-- Diploma paper -->
  <rect x="14" y="20" width="48" height="40" rx="2" fill="#fffaf2" stroke="#92400e" stroke-width="2" />
  <path d="M20 30 H56" stroke="#92400e" stroke-width="1.5" />
  <path d="M20 38 H52" stroke="#92400e" stroke-width="1.5" />
  <path d="M20 46 H44" stroke="#92400e" stroke-width="1.5" />
  <!-- Wax seal -->
  <circle cx="58" cy="56" r="14" fill="url(#bvd2-seal)" stroke="#7f1d1d" stroke-width="1.5" />
  <!-- Seal star (path instead of text) -->
  <path d="M58 50 L60 54 L64 55 L61 58 L62 62 L58 60 L54 62 L55 58 L52 55 L56 54 Z" fill="#fef3c7" stroke="#fef3c7" stroke-width="0.5" />
  <!-- Ribbon tails from seal -->
  <path d="M50 66 L46 88 L54 84 L56 88 L60 72" fill="url(#bvd2-ribbon)" stroke="#7f1d1d" stroke-width="1.5" />
  <path d="M66 66 L74 86 L68 84 L68 88 L62 70" fill="url(#bvd2-ribbon)" stroke="#7f1d1d" stroke-width="1.5" />
  <!-- Top sparkle -->
  <path d="M40 8 L42 12 L46 14 L42 16 L40 20 L38 16 L34 14 L38 12 Z" fill="#fbbf24" stroke="#b45309" stroke-width="1" />
</svg>
