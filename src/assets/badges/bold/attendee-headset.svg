<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Bold attendee headphones with equalizer" fill="none">
  <defs>
    <linearGradient id="bah-cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ec4899" />
      <stop offset="1" stop-color="#9d174d" />
    </linearGradient>
    <linearGradient id="bah-band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a855f7" />
      <stop offset="1" stop-color="#6b21a8" />
    </linearGradient>
  </defs>
  <!-- Glow background -->
  <circle cx="48" cy="48" r="38" fill="#fdf4ff" />
  <circle cx="48" cy="48" r="38" fill="none" stroke="#ec4899" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="4 3" />
  <!-- Headband -->
  <path d="M18 50 V40 C18 26 30 16 48 16 C66 16 78 26 78 40 V50" stroke="url(#bah-band)" stroke-width="8" fill="none" stroke-linecap="round" />
  <!-- Left cup -->
  <rect x="10" y="46" width="18" height="26" rx="6" fill="url(#bah-cup)" stroke="#9d174d" stroke-width="2" />
  <!-- Right cup -->
  <rect x="68" y="46" width="18" height="26" rx="6" fill="url(#bah-cup)" stroke="#9d174d" stroke-width="2" />
  <!-- Equalizer bars -->
  <rect x="38" y="38" width="4" height="6" rx="1" fill="#fbbf24" />
  <rect x="46" y="30" width="4" height="14" rx="1" fill="#fbbf24" />
  <rect x="54" y="34" width="4" height="10" rx="1" fill="#fbbf24" />
  <!-- Center star -->
  <path d="M48 56 L50 60 L54 61 L51 63 L52 67 L48 65 L44 67 L45 63 L42 61 L46 60 Z" fill="#fbbf24" stroke="#b45309" stroke-width="1" />
  <!-- Tiny stars around -->
  <circle cx="76" cy="22" r="1.5" fill="#ec4899" />
  <circle cx="20" cy="22" r="1.5" fill="#a855f7" />
  <circle cx="80" cy="74" r="1.5" fill="#a855f7" />
  <circle cx="14" cy="76" r="1.5" fill="#ec4899" />
</svg>
