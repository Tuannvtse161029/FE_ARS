<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Bold spiral galaxy medal" fill="none">
  <defs>
    <linearGradient id="bgm-arm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" />
      <stop offset="0.5" stop-color="#ec4899" />
      <stop offset="1" stop-color="#06b6d4" />
    </linearGradient>
    <radialGradient id="bgm-core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3c7" />
      <stop offset="0.5" stop-color="#fbbf24" />
      <stop offset="1" stop-color="#b45309" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bgm-halo" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.45" />
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>
  </defs>
  <circle cx="48" cy="48" r="42" fill="url(#bgm-halo)" />
  <!-- Outer ring -->
  <circle cx="48" cy="48" r="34" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="2 3" />
  <!-- Spiral arms (rotated) -->
  <g transform="rotate(0 48 48)">
    <path d="M48 48 C 56 44 60 36 56 28 C 52 22 44 22 40 28" fill="none" stroke="url(#bgm-arm)" stroke-width="3" stroke-linecap="round" />
    <path d="M48 48 C 40 52 36 60 40 68 C 44 74 52 74 56 68" fill="none" stroke="url(#bgm-arm)" stroke-width="3" stroke-linecap="round" />
    <path d="M48 48 C 56 52 64 56 64 64" fill="none" stroke="url(#bgm-arm)" stroke-width="3" stroke-linecap="round" />
    <path d="M48 48 C 40 44 32 40 32 32" fill="none" stroke="url(#bgm-arm)" stroke-width="3" stroke-linecap="round" />
  </g>
  <g transform="rotate(45 48 48)">
    <path d="M48 48 C 56 44 60 36 56 28 C 52 22 44 22 40 28" fill="none" stroke="url(#bgm-arm)" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7" />
    <path d="M48 48 C 40 52 36 60 40 68 C 44 74 52 74 56 68" fill="none" stroke="url(#bgm-arm)" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7" />
  </g>
  <!-- Bright core -->
  <circle cx="48" cy="48" r="10" fill="url(#bgm-core)" />
  <circle cx="48" cy="48" r="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1" />
  <path d="M48 42 L49 47 L54 48 L49 49 L48 54 L47 49 L42 48 L47 47 Z" fill="#fbbf24" />
  <!-- Star sparkles -->
  <circle cx="14" cy="14" r="1.5" fill="#fef3c7" />
  <circle cx="80" cy="16" r="1.5" fill="#fef3c7" />
  <circle cx="18" cy="80" r="1.5" fill="#fef3c7" />
  <circle cx="82" cy="78" r="1.5" fill="#fef3c7" />
</svg>
