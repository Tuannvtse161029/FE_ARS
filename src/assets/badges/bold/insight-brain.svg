<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Bold insight brain inside lightbulb" fill="none">
  <defs>
    <linearGradient id="bbul-bulb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7" />
      <stop offset="1" stop-color="#fbbf24" />
    </linearGradient>
    <radialGradient id="bbul-glow" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#fef3c7" stop-opacity="0.85" />
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bbul-brain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ec4899" />
      <stop offset="1" stop-color="#9d174d" />
    </linearGradient>
  </defs>
  <!-- Halo -->
  <circle cx="48" cy="40" r="38" fill="url(#bbul-glow)" />
  <!-- Bulb glass -->
  <path d="M48 6 C30 6 18 18 18 36 C18 48 26 56 32 62 V72 H64 V62 C70 56 78 48 78 36 C78 18 66 6 48 6 Z" fill="url(#bbul-bulb)" stroke="#b45309" stroke-width="2" />
  <!-- Brain inside -->
  <ellipse cx="48" cy="40" rx="22" ry="18" fill="url(#bbul-brain)" stroke="#831843" stroke-width="1.5" />
  <!-- Brain folds -->
  <path d="M36 30 C42 38 42 42 36 50 M48 26 C42 36 54 46 48 56 M60 30 C54 38 54 42 60 50" stroke="#fbcfe8" stroke-width="2" fill="none" />
  <!-- Filament -->
  <path d="M40 38 L48 48 L56 38" stroke="#dc2626" stroke-width="2" fill="none" stroke-linecap="round" />
  <!-- Socket -->
  <path d="M30 72 H66 V76 H30" fill="#94a3b8" stroke="#475569" stroke-width="1.5" />
  <path d="M32 78 H64 V82 H32" fill="#94a3b8" stroke="#475569" stroke-width="1.5" />
  <path d="M36 84 H60 L54 92 H42" fill="#94a3b8" stroke="#475569" stroke-width="1.5" />
  <!-- Sparkles -->
  <path d="M14 24 L16 28 L20 30 L16 32 L14 36 L12 32 L8 30 L12 28 Z" fill="#fbbf24" stroke="#b45309" stroke-width="1" />
  <path d="M82 24 L84 28 L88 30 L84 32 L82 36 L80 32 L76 30 L80 28 Z" fill="#fbbf24" stroke="#b45309" stroke-width="1" />
</svg>
