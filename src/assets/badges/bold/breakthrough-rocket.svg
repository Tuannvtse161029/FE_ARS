<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Bold breakthrough rocket launch" fill="none">
  <defs>
    <linearGradient id="bbr-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc" />
      <stop offset="1" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="bbr-fin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dc2626" />
      <stop offset="1" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="bbr-flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" />
      <stop offset="0.6" stop-color="#f97316" />
      <stop offset="1" stop-color="#c2410c" />
    </linearGradient>
  </defs>
  <!-- Smoke clouds -->
  <ellipse cx="22" cy="74" rx="16" ry="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" />
  <ellipse cx="40" cy="78" rx="14" ry="5" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1" />
  <ellipse cx="58" cy="76" rx="12" ry="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" />
  <!-- Rocket body -->
  <path d="M48 4 C56 4 60 12 60 22 V62 L48 70 L36 62 V22 C36 12 40 4 48 4 Z" fill="url(#bbr-body)" stroke="#1e293b" stroke-width="2" />
  <!-- Window -->
  <circle cx="48" cy="26" r="7" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2" />
  <circle cx="46" cy="24" r="2" fill="#dbeafe" />
  <!-- Body stripe -->
  <rect x="36" y="40" width="24" height="4" fill="#dc2626" />
  <rect x="36" y="48" width="24" height="4" fill="#fbbf24" />
  <!-- Fins -->
  <path d="M36 50 L26 70 L36 62 Z" fill="url(#bbr-fin)" stroke="#7f1d1d" stroke-width="1.5" />
  <path d="M60 50 L70 70 L60 62 Z" fill="url(#bbr-fin)" stroke="#7f1d1d" stroke-width="1.5" />
  <!-- Flame trail -->
  <path d="M40 70 L48 90 L56 70 Z" fill="url(#bbr-flame)" stroke="#c2410c" stroke-width="1.5" />
  <path d="M44 70 L48 82 L52 70 Z" fill="#fef3c7" />
  <!-- Stars -->
  <circle cx="14" cy="14" r="1.5" fill="#fbbf24" />
  <circle cx="82" cy="14" r="1.5" fill="#fbbf24" />
  <circle cx="80" cy="40" r="1.5" fill="#fbbf24" />
  <circle cx="12" cy="38" r="1.5" fill="#fbbf24" />
</svg>
