<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Bold diamond-cut gem trophy" fill="none">
  <defs>
    <linearGradient id="bdg-gem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5f3fc" />
      <stop offset="0.5" stop-color="#06b6d4" />
      <stop offset="1" stop-color="#0e7490" />
    </linearGradient>
    <linearGradient id="bdg-shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="bdg-halo" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
  </defs>
  <circle cx="48" cy="44" r="40" fill="url(#bdg-halo)" />
  <!-- Diamond crown (5 facets) -->
  <path d="M24 28 L48 12 L72 28 L60 44 L48 32 L36 44 Z" fill="url(#bdg-gem)" stroke="#0e7490" stroke-width="2" stroke-linejoin="round" />
  <path d="M36 44 L48 32 L60 44 Z" fill="#0891b2" stroke="#0e7490" stroke-width="2" stroke-linejoin="round" />
  <path d="M24 28 L36 44 L48 32" fill="none" stroke="#67e8f9" stroke-width="1" />
  <path d="M72 28 L60 44 L48 32" fill="none" stroke="#67e8f9" stroke-width="1" />
  <!-- Shine -->
  <path d="M30 22 L40 18 L42 30 Z" fill="url(#bdg-shine)" />
  <!-- Base -->
  <rect x="20" y="64" width="56" height="6" fill="#fbbf24" stroke="#b45309" stroke-width="1.5" />
  <rect x="14" y="70" width="68" height="10" rx="2" fill="url(#bdg-gem)" stroke="#0e7490" stroke-width="2" />
  <!-- Light rays -->
  <path d="M48 6 L48 14 M16 12 L20 16 M80 12 L76 16" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
</svg>
