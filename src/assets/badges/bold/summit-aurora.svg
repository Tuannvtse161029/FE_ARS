<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Bold summit with sunburst and aurora" fill="none">
  <defs>
    <linearGradient id="bsm-peak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc" />
      <stop offset="1" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="bsm-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.6" />
      <stop offset="0.6" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="1" stop-color="#0a3a8a" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="bsm-sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3c7" />
      <stop offset="0.4" stop-color="#fbbf24" />
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Sky band -->
  <path d="M0 0 H96 V50 C72 30 24 32 0 54 Z" fill="url(#bsm-sky)" />
  <!-- Aurora ribbons -->
  <path d="M0 36 C24 24 48 40 96 28" stroke="#10b981" stroke-width="2" fill="none" stroke-opacity="0.7" />
  <path d="M0 44 C24 32 48 48 96 36" stroke="#22d3ee" stroke-width="2" fill="none" stroke-opacity="0.5" />
  <!-- Sunburst -->
  <circle cx="48" cy="40" r="16" fill="url(#bsm-sun)" />
  <path d="M48 4 L48 12 M48 68 L48 76 M4 40 L12 40 M84 40 L92 40 M16 16 L22 22 M74 22 L80 16 M16 64 L22 58 M74 58 L80 64" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
  <!-- Background mountains -->
  <path d="M0 66 L18 38 L28 50 L40 28 L52 46 L60 36 L70 52 L82 28 L96 60 V72 H0 Z" fill="#475569" />
  <!-- Front peak -->
  <path d="M22 76 L40 28 L56 64 L48 50 L60 76 Z" fill="url(#bsm-peak)" stroke="#1e293b" stroke-width="2" />
  <!-- Snow -->
  <path d="M34 40 L40 28 L48 38 L42 40 L40 36 L36 42 Z" fill="#fef3c7" stroke="#1e293b" stroke-width="1" />
  <!-- Flag pole -->
  <path d="M40 28 V12" stroke="#1e293b" stroke-width="2" />
  <path d="M40 12 L52 16 L40 20" fill="#dc2626" stroke="#7f1d1d" stroke-width="1.5" />
</svg>
