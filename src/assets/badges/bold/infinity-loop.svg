<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Bold infinity mentoring loop" fill="none">
  <defs>
    <linearGradient id="bin-loop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" />
      <stop offset="0.5" stop-color="#ec4899" />
      <stop offset="1" stop-color="#7c3aed" />
    </linearGradient>
    <radialGradient id="bin-glow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.5" />
      <stop offset="1" stop-color="#a855f7" stop-opacity="0" />
