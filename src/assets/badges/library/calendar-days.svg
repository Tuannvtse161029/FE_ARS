<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Calendar with check marks" fill="none">
  <!-- Calendar with completed days -->
  <!-- Header -->
  <rect x="14" y="14" width="68" height="56" rx="4" fill="#ffffff" stroke="#0a3a8a" stroke-width="2" />
  <!-- Top red bar -->
  <rect x="14" y="14" width="68" height="14" fill="#dc2626" stroke="#0a3a8a" stroke-width="2" />
  <!-- Hanging tabs -->
  <rect x="28" y="8" width="6" height="14" rx="2" fill="#475569" stroke="#0a3a8a" stroke-width="1.5" />
  <rect x="62" y="8" width="6" height="14" rx="2" fill="#475569" stroke="#0a3a8a" stroke-width="1.5" />
  <!-- Day cells (4 cols x 3 rows) -->
  <!-- Row 1 -->
  <rect x="22" y="36" width="10" height="10" rx="1.5" fill="#007aff" />
  <path d="M24 41 L27 44 L31 39" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" />
  <rect x="36" y="36" width="10" height="10" rx="1.5" fill="#007aff" />
  <path d="M38 41 L41 44 L45 39" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" />
  <rect x="50" y="36" width="10" height="10" rx="1.5" fill="#007aff" />
  <path d="M52 41 L55 44 L59 39" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" />
  <rect x="64" y="36" width="10" height="10" rx="1.5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" />
  <!-- Row 2 -->
  <rect x="22" y="50" width="10" height="10" rx="1.5" fill="#007aff" />
  <path d="M24 55 L27 58 L31 53" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" />
  <rect x="36" y="50" width="10" height="10" rx="1.5" fill="#007aff" />
  <path d="M38 55 L41 58 L45 53" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" />
  <rect x="50" y="50" width="10" height="10" rx="1.5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" />
  <rect x="64" y="50" width="10" height="10" rx="1.5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" />
  <!-- Header label dot row -->
  <circle cx="22" cy="21" r="1.5" fill="#ffffff" />
  <circle cx="38" cy="21" r="1.5" fill="#ffffff" />
  <circle cx="52" cy="21" r="1.5" fill="#ffffff" />
  <circle cx="68" cy="21" r="1.5" fill="#ffffff" />
  <circle cx="80" cy="21" r="1.5" fill="#ffffff" />
</svg>
