<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Community chat bubble with check" fill="none">
  <!-- Two overlapping chat bubbles with check -->
  <!-- Back bubble (lighter) -->
  <rect x="10" y="14" width="42" height="32" rx="8" fill="#dceaff" stroke="#0a3a8a" stroke-width="2" />
  <path d="M22 46 L18 54 L28 46" fill="#dceaff" stroke="#0a3a8a" stroke-width="2" stroke-linejoin="round" />
  <!-- Front bubble (filled) -->
  <rect x="40" y="44" width="46" height="34" rx="8" fill="#007aff" stroke="#0a3a8a" stroke-width="2" />
  <path d="M52 78 L46 86 L58 78" fill="#007aff" stroke="#0a3a8a" stroke-width="2" stroke-linejoin="round" />
  <!-- Check mark inside front bubble -->
  <path d="M50 60 L58 68 L74 50" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Dots inside back bubble -->
  <circle cx="22" cy="30" r="2" fill="#0a3a8a" />
  <circle cx="30" cy="30" r="2" fill="#0a3a8a" />
  <circle cx="38" cy="30" r="2" fill="#0a3a8a" />
</svg>
