<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Community anchor badge" fill="none">
  <!-- Anchor symbol - community / stability -->
  <!-- Top ring -->
  <circle cx="48" cy="14" r="6" fill="none" stroke="#0a3a8a" stroke-width="3" />
  <!-- Vertical shaft -->
  <rect x="46" y="20" width="4" height="50" fill="#0a3a8a" />
  <!-- Crossbar -->
  <rect x="30" y="26" width="36" height="4" fill="#0a3a8a" />
  <!-- Crossbar end caps -->
  <circle cx="30" cy="28" r="3" fill="#007aff" />
  <circle cx="66" cy="28" r="3" fill="#007aff" />
  <!-- Curved hooks at bottom -->
  <path d="M24 66 C24 78 38 82 46 78 L48 72" fill="none" stroke="#0a3a8a" stroke-width="6" stroke-linecap="round" />
  <path d="M72 66 C72 78 58 82 50 78 L48 72" fill="none" stroke="#0a3a8a" stroke-width="6" stroke-linecap="round" />
  <!-- Highlight dots -->
  <circle cx="50" cy="20" r="1.5" fill="#007aff" />
  <circle cx="48" cy="86" r="1.5" fill="#007aff" />
</svg>
