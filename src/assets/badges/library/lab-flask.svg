  <circle cx="58" cy="66" r="2.5" fill="#007aff" />
  <circle cx="42" cy="68" r="1.5" fill="#007aff" />
  <circle cx="54" cy="70" r="1.5" fill="#007aff" />
  <!-- Rising bubble trails -->
  <circle cx="38" cy="50" r="1.2" fill="#007aff" stroke="#007aff" stroke-width="0.5" />
  <circle cx="56" cy="48" r="1.2" fill="#007aff" stroke="#007aff" stroke-width="0.5" />
