<!doctype html>
<!--
  payos-popup-closing.html

  Static HTML page that PayOS redirects the checkout popup to after a
  payment attempt. Lives under the origin root (e.g.
  https://arsplatform.onrender.com/payos-popup-closing.html) so the
  browser requests it WITHOUT triggering a full React/JS-bundle load —
  the popup was opened from `src/pages/Subscription/Subscription.tsx` via
  `window.open`, and the in-memory JWT only lives on the parent tab, so
  anything that boots the SPA here would either render briefly before
  the auth guard kicks in, or worse redirect to /login. By serving this
  page as a static asset we avoid both, AND the popup shows a focused
  "Payment window is closing…" message that is clearly not the main
  website UI (which was the user's feedback on the prior splash).

  The page is intentionally tiny:
    - One inline CSS block for the centered spinner + label
    - One inline JS that:
        1. Reads `?status=...` from the URL to decide which message to
           show (success / cancelled / failed / unknown).
        2. Calls `window.close()` after a short delay (~800 ms) so the
           user can see the message flicker on screen before the
           popup disappears.

  No fonts are loaded and no external requests are made — the popup
  closes in well under a second on any modern browser.

  CSP implications: the parent `index.html` ships
    `script-src 'self' 'unsafe-inline'`
  so the inline `<script>` below is permitted by the page's CSP only
  when this file is served by the SAME origin. When PayOS redirects
  the popup to this URL the response inherits the static server's
  default CSP, which is permissive enough for an inline script on a
  one-shot payment-completion page. If the deploy target tightens the
  CSP further, move the inline script to an external `.js` file.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Lock the popup down so the browser doesn't render any toolbar /
      scrollbars around the centered card. `popup` is the only window
      feature we need.
    -->
    <title>Payment window is closing</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f8fafc;
        --fg: #1a202c;
        --fg-muted: #4a5568;
        --success: #16a34a;
        --fail: #dc2626;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100%;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        max-width: 420px;
        text-align: center;
      }
      .icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        margin: 0 auto 16px;
        background: rgba(22, 163, 74, 0.12);
        color: var(--success);
      }
      .icon[data-state="cancelled"],
      .icon[data-state="failed"],
      .icon[data-state="unknown"] {
        background: rgba(220, 38, 38, 0.12);
        color: var(--fail);
      }
      .icon[data-state="closing"] {
        background: rgba(59, 130, 246, 0.12);
        color: #2563eb;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 8px;
        line-height: 1.3;
      }
      p {
        font-size: 0.95rem;
        color: var(--fg-muted);
        margin: 0;
        line-height: 1.4;
      }
      /* Tiny CSS-only spinner used while we resolve the URL params and
         before the popup closes. Three animated dots keep the file
         dependency-free. */
      .dots {
        display: inline-block;
        width: 24px;
        height: 24px;
        border: 3px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        vertical-align: middle;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      /* Reduce motion preference */
      @media (prefers-reduced-motion: reduce) {
        .dots {
          animation: none;
          border-right-color: currentColor;
        }
      }
    </style>
  </head>
  <body>
    <div class="card" data-component="PayOSPopupClosing">
      <div class="icon" id="icon" data-state="closing" aria-hidden="true">
        <!-- Pure-CSS spinner; updated to a static check / X by the
             inline script below once we know the payment outcome. -->
        <span class="dots" id="glyph-spinner" role="presentation"></span>
      </div>
      <h1 id="title">Payment window is closing&hellip;</h1>
      <p id="hint">
        Returning to the subscription page&hellip; You can close this
        window if it does not close automatically.
      </p>
    </div>
    <script>
      (function () {
        // PayOS appends its own params (code, status, orderCode, cancel)
        // to our returnUrl. The FE only cares about the coarse-grained
        // status — the parent tab's polling loop reads the BE's
        // authoritative subscription state, so this page just needs to
        // show a friendly message before closing.
        var params = new URLSearchParams(window.location.search);
        var cancelFlag =
          params.get('cancel') === 'true' || params.get('cancel') === '1';
        var payosCode = params.get('code');
        var payosStatusParam = (params.get('status') || '').toLowerCase();
        var state;
        if (cancelFlag || payosStatusParam === 'cancelled') {
          state = 'cancelled';
        } else if (
          payosStatusParam === 'failed' ||
          (payosCode !== null && payosCode !== '00')
        ) {
          state = 'failed';
        } else if (
          payosStatusParam === 'success' ||
          payosCode === '00'
        ) {
          state = 'success';
        } else {
          // PayOS didn't append any recognisable param — still close
          // the popup; the parent tab's polling loop will resolve the
          // final outcome.
          state = 'unknown';
        }
        var iconEl = document.getElementById('icon');
        var spinner = document.getElementById('glyph-spinner');
        var titleEl = document.getElementById('title');
        var hintEl = document.getElementById('hint');
        if (iconEl) iconEl.setAttribute('data-state', state);
        if (spinner) {
          // Replace the spinning dots with a static icon that matches
          // the outcome. We draw a check / X with a tiny SVG so we
          // don't need to ship an icon font or extra asset.
          if (state === 'success') {
            spinner.outerHTML =
              '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>';
            if (titleEl) titleEl.textContent = 'Payment confirmed';
            if (hintEl)
              hintEl.textContent =
                'This window will close in a moment. Your subscription will be active in the main tab.';
          } else if (state === 'cancelled') {
            spinner.outerHTML =
              '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="6" y1="18" x2="18" y2="6"></line></svg>';
            if (titleEl) titleEl.textContent = 'Payment cancelled';
            if (hintEl)
              hintEl.textContent =
                'This window will close in a moment. You can return to the subscription page to try again.';
          } else if (state === 'failed') {
            spinner.outerHTML =
              '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="6" y1="18" x2="18" y2="6"></line></svg>';
            if (titleEl) titleEl.textContent = 'Payment failed';
            if (hintEl)
              hintEl.textContent =
                'This window will close in a moment. Please return to the subscription page and try again.';
          } else {
            // Unknown — keep the spinner + generic copy.
            if (titleEl) titleEl.textContent = 'Payment window is closing\u2026';
            if (hintEl)
              hintEl.textContent =
                'This window will close automatically. Your subscription status will refresh in the main tab.';
          }
        }
        // Auto-close. `window.close()` only works for windows that
        // were opened via script (the PayOS popup was, via `window.open`
        // from `src/pages/Subscription/Subscription.tsx`). 800 ms is
        // long enough for the icon swap + label update to paint, short
        // enough that the user perceives the popup as "snapping shut"
        // rather than lingering.
        var AUTO_CLOSE_MS = 800;
        window.setTimeout(function () {
          window.close();
        }, AUTO_CLOSE_MS);
      })();
    </script>
  </body>
</html>
