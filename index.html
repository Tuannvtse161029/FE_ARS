<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Vietnamese-friendly font stack ───────────────────
         Roboto (preferred) is loaded via the non-blocking `media="print"
         onload=…` trick below so the stylesheet does NOT block first
         paint. Browsers fetch it at low priority while the page renders
         with the next stack entry — Segoe UI on Windows, San Francisco
         on macOS, Roboto on Android. We swap `media` to `all` once the
         file is parsed so the rendered text reflows to Roboto without a
         layout shift.

         Why not `<link rel="stylesheet">`? A blocking stylesheet on
         `fonts.googleapis.com` / `fonts.gstatic.com` added 5-10 s to
         dev-server cold start when the network was slow. The blocking
         hint also stalled the Vite HMR client from connecting.

         Why no `preconnect` to fonts.gstatic.com? We keep a single
         preconnect to fonts.googleapis.com (which serves the CSS) and
         let the CSS file's `@font-face` URLs trigger the
         fonts.gstatic.com connection lazily. This avoids a useless
         preconnect handshake when the network is fast enough that the
         font never matters.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700;800&display=swap"
      />
    </noscript>
    <meta
      name="description"
      content="ARS is a trusted academic platform for research discovery, structured paper review, seminars, and role-based collaboration."
    />
    <meta name="theme-color" content="#10172b" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ARS — Academic Research System" />
    <meta
      property="og:description"
      content="Research discovery, review, and collaboration in one trusted academic platform."
    />
    <meta property="og:image" content="https://fe-ars.vercel.app/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ARS — Academic Research System" />
    <meta
      name="twitter:description"
      content="Research discovery, review, and collaboration in one trusted academic platform."
    />
    <meta name="twitter:image" content="https://fe-ars.vercel.app/og.png" />
    <title>ARS Platform - Academic Research System</title>
  </head>
