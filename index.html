<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Bilingual font stack (this worker) ───────────────────
         The platform pairs one typeface per language. Both families
         ship from Google Fonts with the full weight range we use:

         English (Latin)        → Inter, weights 300-800
         Vietnamese             → Be Vietnam Pro, weights 300-800

         Why not `<link rel="stylesheet">`? A blocking stylesheet on
         `fonts.googleapis.com` / `fonts.gstatic.com` added 5-10 s to
         dev-server cold start when the network was slow. The blocking
         hint also stalled the Vite HMR client from connecting. The
         non-blocking `media="print" onload=…` trick reflows to the
         loaded fonts without layout shift once the file parses.

         Why no `preconnect` to fonts.gstatic.com? We keep a single
         preconnect to fonts.googleapis.com (which serves the CSS) and
         let the CSS file's `@font-face` URLs trigger the
         fonts.gstatic.com connection lazily. This avoids a useless
         preconnect handshake when the network is fast enough that the
         font never matters.

         The `display=swap` query keeps first paint from blocking on
         the network round-trip and the platform's CSS uses the
         `--font-family-{en,vi}-{ui,serif,mono}` tokens declared in
         ars-tokens.css — the `<html lang="…">` attribute (set by the
         i18n provider) rebinds `--font-family-ui/serif/mono` to the
         correct per-locale stack automatically.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
      />
    </noscript>
    <meta
      name="description"
      content="ARS is a trusted academic platform for research discovery, structured paper review, seminars, and role-based collaboration."
    />
    <!-- Default browser chrome colour — yellow project primary.
         Two media-gated tags cover the OS-level light/dark preference
         so the address bar matches on a fresh visit. A third tag
         (no media) is overwritten by `useThemeToggle` once the React
         app mounts and the user's explicit choice wins. -->
    <meta name="theme-color" content="#fff8e8" />
    <meta name="theme-color" content="#0d1320" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fff8e8" media="(prefers-color-scheme: light)" />
    <script>
      // ── Pre-paint theme bootstrap (this worker) ────────────────
      // Synchronously apply the user's last-chosen theme to <html>
      // BEFORE the browser computes any CSS for <body>. Without this,
      // a user on Archive Dusk sees a flash of cream parchment on
      // every reload — the `:root` selector in ars-tokens.css defaults
      // to Paper Day, and `data-theme` only flips once React mounts
      // (i.e. after the JS bundle parses and the React tree commits).
      //
      // This script runs in <head> as a classic (non-module) script,
      // which executes synchronously before the browser parses the
      // <body> or fetches the deferred module bundle. We mirror the
      // same legacy-value migration that `useThemeToggle` performs so
      // a stored `night` / `light` value from an earlier session
      // doesn't bounce the user back to the default.
      //
      // Wrapped in try/catch because localStorage access can throw in
      // private-mode browsers, sandboxed iframes, or storage-blocked
      // environments. If anything fails we fall back to Paper Day,
      // which matches the `:root` cascade defaults so there is no
      // visible flash in the failure path either.
      (function () {
        try {
          var raw = localStorage.getItem('ars_theme');
          var theme = raw;
          if (raw === 'night') theme = 'archive-dusk';
          else if (raw === 'light') theme = 'paper-day';
          else if (raw !== 'archive-dusk' && raw !== 'paper-day') theme = 'paper-day';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'paper-day');
        }
      })();
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ARS — Academic Research System" />
    <meta
      property="og:description"
      content="Research discovery, review, and collaboration in one trusted academic platform."
    />
    <meta property="og:image" content="https://fe-ars.vercel.app/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ARS — Academic Research System" />
    <meta
      name="twitter:description"
      content="Research discovery, review, and collaboration in one trusted academic platform."
    />
    <meta name="twitter:image" content="https://fe-ars.vercel.app/og.png" />
    <title>ARS Platform - Academic Research System</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
