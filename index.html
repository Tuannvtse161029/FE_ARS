<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Vietnamese-friendly font: Roboto ──────────────
         Roboto carries the full Latin-Extended-A and Vietnamese-specific
         code points (ă, â, ê, ô, ơ, ư plus every tone combination). The
         preconnect warm-up keeps the request off the critical render path;
         `display=swap` shows the system fallback immediately so text is never
         invisible. The subset list includes `vietnamese` so the browser only
         downloads the Vietnamese glyphs the user actually needs.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="ARS is a trusted academic platform for research discovery, structured paper review, seminars, and role-based collaboration."
    />
    <meta name="theme-color" content="#10172b" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ARS — Academic Research System" />
    <meta
      property="og:description"
      content="Research discovery, review, and collaboration in one trusted academic platform."
    />
    <meta property="og:image" content="https://fe-ars.vercel.app/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ARS — Academic Research System" />
    <meta
      name="twitter:description"
      content="Research discovery, review, and collaboration in one trusted academic platform."
    />
    <meta name="twitter:image" content="https://fe-ars.vercel.app/og.png" />
    <title>ARS Platform - Academic Research System</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
