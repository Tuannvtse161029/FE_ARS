name: Auto-update README integrations

on:
  push:
    branches: [main, master]
    paths:
      - 'src/utils/constants.ts'
      - 'src/services/**'
      - 'src/i18n/dictionaries/**'
      - 'package.json'
      - 'docs/**'
      - 'scripts/update-readme-integrations.mjs'
  workflow_dispatch:
    inputs:
      force_commit:
        description: 'Commit even if only the auto-block changed'
        required: false
        default: 'false'

# Skip when a PR is the trigger — keeps PR branches clean. The PR fast
# checks still validate the script via a separate check step below.
concurrency:
  group: readme-integrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-readme:
    name: Regenerate README integration block
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # We commit back to the same branch, so we need the GH token and
          # full history for the diff step.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (no scripts, audit off)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify the integration markers exist in README.md
        id: check-markers
        run: |
          node scripts/update-readme-integrations.mjs --check

      - name: Update README integration block
        # --write always rewrites; the script writes only when the rendered
        # content actually differs from the current README, so reruns are
        # idempotent.
        run: node scripts/update-readme-integrations.mjs --write

      - name: Show diff
        id: diff
        run: |
          # Surface a meaningful diff so reviewers see what changed.
          git --no-pager diff -- README.md | tee README.diff
          # Record whether the README actually changed.
          if git diff --quiet -- README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git identity
        if: steps.diff.outputs.changed == 'true'
        env:
          BOT_EMAIL: readme-bot[bot]@users.noreply.github.com
          BOT_NAME: readme-bot
        run: |
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          # Amend the latest commit if this workflow fired on the same push
          # (most common case for `push` triggers), otherwise create a new
          # commit on top of the branch.
          if git log -1 --pretty=%s | grep -q "^Auto-update README integrations$"; then
            git add README.md
            git commit --amend --no-edit
          else
            git add README.md
            git commit -m "Auto-update README integrations"
          fi
          git push origin HEAD:refs/heads/${GITHUB_REF_NAME}

      - name: Summary
        if: always()
        run: |
          {
            echo "### README integrations"
            echo ""
            if [ "${{ steps.diff.outputs.changed }}" = "true" ]; then
              echo "✅ README.md updated and committed."
            else
              echo "ℹ️ README.md already in sync — no commit needed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"