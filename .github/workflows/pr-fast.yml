name: PR fast checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-fast-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-fast:
    name: Build + lint + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VITE_API_BASE_URL: http://127.0.0.1:4173
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Critical-flow smoke
        run: npm run test:smoke

  pr-unit-full:
    name: Full unit suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_API_BASE_URL: http://127.0.0.1:4173
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run full unit suite
        run: npm run test:unit
