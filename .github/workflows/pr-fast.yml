name: PR fast checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-fast-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-critical-tests:
    name: Build + critical flows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_API_BASE_URL: http://127.0.0.1:4173
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Production build
        run: npm run build

      - name: Critical current-flow tests
        run: npm run test:smoke
