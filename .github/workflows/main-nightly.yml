name: Main and feature verification

on:
  push:
    branches:
      - main
      - phuongpdse140481_FE
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: branch-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-critical-tests:
    name: Build + critical flows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_API_BASE_URL: http://127.0.0.1:4173
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Production build
        run: npm run build

      - name: Critical current-flow tests
        run: npm run test:smoke
