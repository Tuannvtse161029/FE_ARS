name: Main nightly

# No concurrency cancel for main-nightly — nightly runs are cheap and serial.
on:
  push:
    branches: [main]
  schedule:
    # 02:00 UTC every day. Adjust as needed in repo Settings → Secrets.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you triggering this run manually?'
        required: false
        default: 'manual'

jobs:
  # ── Unit ────────────────────────────────────────────────────────────
  unit:
    name: Unit (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_API_BASE_URL: http://127.0.0.1:4173
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run
        run: npm run test:unit

      - name: Upload unit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-report
          path: |
            coverage/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  # ── Integration ─────────────────────────────────────────────────────
  integration:
    name: Integration (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_API_BASE_URL: http://127.0.0.1:4173
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run
        run: npm run test:integration

      - name: Upload integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-report
          path: |
            coverage/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  # ── E2E ─────────────────────────────────────────────────────────────
  e2e:
    name: E2E (Playwright headless)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_API_BASE_URL: http://127.0.0.1:4173
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  # ── Coverage ────────────────────────────────────────────────────────
  coverage:
    name: Coverage (Vitest v8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_API_BASE_URL: http://127.0.0.1:4173
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/
          if-no-files-found: ignore
          retention-days: 30
